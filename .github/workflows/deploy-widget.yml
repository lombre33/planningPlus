name: Déployer le widget sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'widget/**'
      - 'widget-js/**'
      - '.github/workflows/deploy-widget.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; ne pas annuler celle en cours pour ne
# jamais laisser Pages sur un déploiement partiel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 : le JavaScript natif (widget-js) s'appuie sur vitest 5, qui
      # demande 22.12 ou plus.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            widget/package-lock.json
            widget-js/package-lock.json

      # --- Widget en production : TypeScript, paquet Vite, publié à la racine.
      - run: npm ci
        working-directory: widget

      - run: npm test
        working-directory: widget

      # tsc --noEmit puis vite build (voir widget/package.json) : une
      # erreur de typage bloque la publication au même titre qu'un test
      # cassé, plutôt que de la découvrir après coup sur Pages.
      - run: npm run build
        working-directory: widget

      # --- Widget en JavaScript natif (essai) : aucun paquet à construire, les
      # fichiers sont publiés tels quels sous /js/. Voir widget-js/README.md.
      - run: npm ci
        working-directory: widget-js

      - run: npm test
        working-directory: widget-js

      # Information seulement : tant que les deux dossiers coexistent, un
      # changement de widget/ (la V1) que widget-js/ (la V2) n'a pas reçu
      # apparaît en avertissement (migration/README.md, « Le sceau »). Il
      # n'arrête pas la publication.
      - name: Contrôler que la V2 n'a pas manqué un changement de la V1
        run: |
          node migration/convertir.mjs --verifier || echo "::warning::widget/ a changé depuis la conversion de widget-js/ : voir migration/README.md (le sceau dit s'il suffit de relancer la conversion ou s'il faut reporter le changement à la main)"

      # Le site publié : le paquet TypeScript à la racine, les seuls fichiers
      # dont le JavaScript natif a besoin sous js/ (l'assemblage échoue si un
      # import ne mène à rien).
      - name: Assembler le site
        run: |
          mkdir _site
          cp -r widget/dist/. _site/
          node widget-js/outils/assembler-site.mjs _site/js

      # enablement par défaut à false (vérifié sur les logs d'exécution,
      # 2026-09-23) : configure-pages ne bascule alors jamais Settings →
      # Pages → Source sur « GitHub Actions », qui est resté sur « Deploy
      # from a branch » (réglage d'origine d'Antoine, jamais changé) depuis
      # la toute première publication. Le pipeline Jekyll caché de GitHub
      # (« pages-build-deployment ») tournait donc à chaque push sur main,
      # sans filtre de chemin, et se disputait la page avec ce workflow —
      # le README l'emportant à chaque fois qu'il finissait en dernier.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
