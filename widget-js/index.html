<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanningPlus</title>
    <!--
      Aucune étape de construction : le navigateur charge ces fichiers tels
      quels. Les feuilles de style vont dans l'ordre de la cascade (la seconde
      complète la première). Toute nouvelle feuille importée par le code doit
      être ajoutée ici et dans dev-bench.html : `node migration/convertir.mjs`
      le contrôle, et `npm test` vérifie que chaque fichier cité existe.
    -->
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/ui/impression.css" />
    <!--
      Chargé en script classique (pas type="module") car le fichier vendorisé
      s'exécute dans le scope global et expose `window.grist`. Voir
      vendor/README.md pour la provenance de ce fichier.
    -->
    <script src="./vendor/grist-plugin-api.js"></script>
  </head>
  <body>
    <div id="app">Connexion au document…</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
